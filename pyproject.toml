[project]
name = "ig-archiver"
version = "0.1.0"
description = "Small Instagram archive daemon using instagrapi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "instagrapi>=3.0.3,<4",
    "typer>=0.16,<1",
    "rich>=14,<15",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.scripts]
ig-archive = "ig_archiver.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ig_archiver"]
