[project]
name = "ig-archiver"
version = "0.2.0"
description = "Small Instagram archive daemon with a local read-only viewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "instagrapi>=3.2.6,<4",
    "typer>=0.28.0,<1",
    "rich>=15.0.0,<16",
    "tzdata>=2026.6; platform_system == 'Windows'",
]

[project.scripts]
ig-archive = "ig_archiver.cli:app"

[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ig_archiver"]
